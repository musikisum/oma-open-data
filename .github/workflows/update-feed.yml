name: Update OMA Feed

on:
  schedule:
    - cron: '0 5 * * 1'  # jeden Montag 05:00 UTC
  workflow_dispatch:       # manueller Start per Knopfdruck

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download amb.json (alle Seiten)
        env:
          OMA_API_KEY: ${{ secrets.OMA_API_KEY }}
        run: python download-amb.py --output docs/oma-amb.json

      - name: Convert AMB → RSS
        run: python amb-to-rss.py --input docs/oma-amb.json --output docs/oma-feed.xml

      - name: Convert AMB → MARCXML + MRC
        run: python amb-to-marcxml.py --input docs/oma-amb.json --output docs/oma-marc21.xml --mrc-output docs/oma-marc21.mrc

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/oma-amb.json docs/oma-feed.xml docs/oma-marc21.xml docs/oma-marc21.mrc
          git diff --staged --quiet \
            || git commit -m "chore: feed update $(date -u +%Y-%m-%d)"
          git push
